<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">ライブ機材の同期フロー</title><desc id="desc">ライブ機材の設置確認、所有権と状態の共有、途中参加者との同期、返却と初期化の流れ</desc>
  <defs>
    <linearGradient id="panelBackground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17191b"/><stop offset="0.55" stop-color="#101418"/><stop offset="1" stop-color="#17120f"/></linearGradient>
    <radialGradient id="stationLight" cx="88%" cy="3%" r="76%"><stop offset="0" stop-color="#d69a50" stop-opacity="0.17"/><stop offset="0.42" stop-color="#a46531" stop-opacity="0.045"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient>
    <pattern id="streetGrid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#e9c08a" stroke-opacity="0.035"/></pattern>
    <filter id="cardShadow" x="-10%" y="-15%" width="120%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000000" flood-opacity="0.24"/></filter>
    <clipPath id="panelClip"><rect x="16" y="16" width="1248" height="388" rx="30"/></clipPath>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", "Segoe UI", sans-serif; }
      .title { fill: #f4eee5; font-size: 34px; font-weight: 750; }
      .step { fill: #d99852; font-size: 12px; font-weight: 750; }
      .card-title { fill: #ede8df; font-size: 19px; font-weight: 700; }
      .primary { fill: #f2b16d; font-size: 16px; font-weight: 700; }
      .secondary { fill: #8f9aa1; font-size: 13px; font-weight: 600; }
    </style>
  </defs>
  <g clip-path="url(#panelClip)">
    <rect x="16" y="16" width="1248" height="388" rx="30" fill="url(#panelBackground)"/><rect x="16" y="16" width="1248" height="388" rx="30" fill="url(#stationLight)"/><rect x="16" y="16" width="1248" height="388" rx="30" fill="url(#streetGrid)"/>
    <path d="M16 129 C290 123 445 137 664 128 C890 119 1055 121 1264 126" fill="none" stroke="#a83831" stroke-opacity="0.56" stroke-width="2"/><path d="M16 136 C295 130 456 144 675 135 C902 126 1068 128 1264 132" fill="none" stroke="#df9d53" stroke-opacity="0.16"/>
    <path d="M16 373 C300 353 483 390 721 368 C943 348 1088 360 1264 351" fill="none" stroke="#54c9c2" stroke-opacity="0.18" stroke-width="1.5"/><path d="M16 393 C292 377 484 405 734 386 C951 369 1110 383 1264 371" fill="none" stroke="#b34236" stroke-opacity="0.22" stroke-width="2"/><text x="1168" y="96" text-anchor="end" fill="#f0c98d" fill-opacity="0.055" font-size="86" font-weight="800">新宿</text>
  </g>
  <rect x="16.5" y="16.5" width="1247" height="387" rx="29.5" fill="none" stroke="#b98a55" stroke-opacity="0.26"/><path d="M46 17 H288" stroke="#c74137" stroke-width="3"/><path d="M288 17 H410" stroke="#dca45f" stroke-width="3"/>
  <rect x="52" y="43" width="4" height="69" rx="2" fill="#c84036"/><text x="72" y="77" class="title">ライブ機材 · 同期フロー</text>
  <g filter="url(#cardShadow)"><rect x="48" y="154" width="272" height="178" rx="18" fill="#14191d" fill-opacity="0.96" stroke="#5c4036" stroke-opacity="0.78"/><rect x="344" y="154" width="272" height="178" rx="18" fill="#14191d" fill-opacity="0.96" stroke="#5b4b38" stroke-opacity="0.78"/><rect x="640" y="154" width="272" height="178" rx="18" fill="#14191d" fill-opacity="0.96" stroke="#355553" stroke-opacity="0.78"/><rect x="936" y="154" width="272" height="178" rx="18" fill="#14191d" fill-opacity="0.96" stroke="#5c4036" stroke-opacity="0.78"/></g>
  <rect x="72" y="177" width="32" height="3" rx="1.5" fill="#c84036"/><text x="72" y="202" class="step">01</text><text x="72" y="235" class="card-title">設置確認</text><text x="72" y="271" class="primary">3 m · 傾斜30°</text><text x="72" y="299" class="secondary">Desktop · VR</text>
  <rect x="368" y="177" width="32" height="3" rx="1.5" fill="#d79b54"/><text x="368" y="202" class="step">02</text><text x="368" y="235" class="card-title">所有権・状態共有</text><text x="368" y="271" class="primary">位置 · 向き</text><text x="368" y="299" class="secondary">画面 · ペン · メディア</text>
  <rect x="664" y="177" width="32" height="3" rx="1.5" fill="#58c9c2"/><text x="664" y="202" class="step">03</text><text x="664" y="235" class="card-title">途中参加者との同期</text><text x="664" y="271" class="primary">現在の状態を再送信</text>
  <rect x="960" y="177" width="32" height="3" rx="1.5" fill="#c84036"/><text x="960" y="202" class="step">04</text><text x="960" y="235" class="card-title">返却・初期化</text><text x="960" y="271" class="primary">返却 · 5 m離脱</text><text x="960" y="299" class="secondary">連動状態を初期化</text>
  <g fill="none" stroke="#d79b54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M324 243 H338"/><path d="M333 238 L338 243 L333 248"/><path d="M620 243 H634"/><path d="M629 238 L634 243 L629 248"/><path d="M916 243 H930"/><path d="M925 238 L930 243 L925 248"/></g>
</svg>
