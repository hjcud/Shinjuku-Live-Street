<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Community gallery placeholder</title>
  <desc id="desc">A reserved sixteen-by-nine image area for future performance and community scenes</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17191b"/>
      <stop offset="0.58" stop-color="#101418"/>
      <stop offset="1" stop-color="#17120f"/>
    </linearGradient>
    <radialGradient id="light" cx="82%" cy="4%" r="82%">
      <stop offset="0" stop-color="#d69a50" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#a46531" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#e9c08a" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="clip">
      <rect x="16" y="16" width="1248" height="688" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="16" y="16" width="1248" height="688" rx="30" fill="url(#panel)"/>
    <rect x="16" y="16" width="1248" height="688" rx="30" fill="url(#light)"/>
    <rect x="16" y="16" width="1248" height="688" rx="30" fill="url(#grid)"/>
    <path d="M16 104 C292 93 468 118 694 103 C916 89 1088 99 1264 92" fill="none" stroke="#a83831" stroke-opacity="0.36" stroke-width="2"/>
    <path d="M16 662 C310 638 498 682 744 651 C958 625 1112 642 1264 628" fill="none" stroke="#54c9c2" stroke-opacity="0.13" stroke-width="1.5"/>
  </g>

  <rect x="16.5" y="16.5" width="1247" height="687" rx="29.5" fill="none" stroke="#b98a55" stroke-opacity="0.24"/>
  <rect x="48" y="48" width="1184" height="592" rx="22" fill="#12171b" fill-opacity="0.48" stroke="#9aa4ad" stroke-opacity="0.34" stroke-width="2" stroke-dasharray="11 12"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="482" y="247" width="278" height="184" rx="18" stroke="#8c969e" stroke-opacity="0.25" stroke-width="4" transform="rotate(-5 621 339)"/>
    <rect x="520" y="233" width="278" height="184" rx="18" fill="#171d21" stroke="#d0a060" stroke-opacity="0.72" stroke-width="4"/>
    <circle cx="711" cy="283" r="18" stroke="#d0a060" stroke-opacity="0.72" stroke-width="4"/>
    <path d="M548 385 L612 320 L657 360 L690 329 L770 385" stroke="#78c8c2" stroke-opacity="0.68" stroke-width="5"/>
  </g>

  <g fill="#89939b">
    <circle cx="622" cy="489" r="5" opacity="0.34"/>
    <circle cx="640" cy="489" r="5" opacity="0.82"/>
    <circle cx="658" cy="489" r="5" opacity="0.34"/>
  </g>
