  <text x="76" y="236" class="label">초기</text><rect x="232" y="224" width="260" height="14" rx="7" fill="#535a61"/><text x="600" y="237" text-anchor="end" class="value">17.65 ms</text><text x="76" y="282" class="label">최신</text><rect x="232" y="270" width="176" height="14" rx="7" fill="url(#latestBar)" filter="url(#barGlow)"/><text x="600" y="283" text-anchor="end" class="value">11.92 ms</text>
  <text x="680" y="192" class="card-title">프레임 시간 P95</text><rect x="1100" y="165" width="104" height="34" rx="17" fill="url(#latestChip)" stroke="#a85b3b" stroke-opacity="0.55"/><text x="1152" y="189" text-anchor="middle" class="delta">−29.1%</text>
  <text x="680" y="236" class="label">초기</text><rect x="836" y="224" width="260" height="14" rx="7" fill="#535a61"/><text x="1204" y="237" text-anchor="end" class="value">24.60 ms</text><text x="680" y="282" class="label">최신</text><rect x="836" y="270" width="184" height="14" rx="7" fill="url(#latestBar)" filter="url(#barGlow)"/><text x="1204" y="283" text-anchor="end" class="value">17.44 ms</text>
  <text x="76" y="394" class="card-title">물리 연산 평균</text><rect x="496" y="367" width="104" height="34" rx="17" fill="url(#latestChip)" stroke="#a85b3b" stroke-opacity="0.55"/><text x="548" y="391" text-anchor="middle" class="delta">−65.3%</text>
  <text x="76" y="438" class="label">초기</text><rect x="232" y="426" width="260" height="14" rx="7" fill="#535a61"/><text x="600" y="439" text-anchor="end" class="value">0.49 ms</text><text x="76" y="484" class="label">최신</text><rect x="232" y="472" width="90" height="14" rx="7" fill="url(#latestBar)" filter="url(#barGlow)"/><text x="600" y="485" text-anchor="end" class="value">0.17 ms</text>
  <text x="680" y="394" class="card-title">프레임당 GC 할당</text><rect x="1100" y="367" width="104" height="34" rx="17" fill="url(#latestChip)" stroke="#a85b3b" stroke-opacity="0.55"/><text x="1152" y="391" text-anchor="middle" class="delta">−88.1%</text>
  <text x="680" y="438" class="label">초기</text><rect x="836" y="426" width="260" height="14" rx="7" fill="#535a61"/><text x="1204" y="439" text-anchor="end" class="value">101.0 KB</text><text x="680" y="484" class="label">최신</text><rect x="836" y="472" width="31" height="14" rx="7" fill="url(#latestBar)" filter="url(#barGlow)"/><text x="1204" y="485" text-anchor="end" class="value">12.0 KB</text>
</svg>
