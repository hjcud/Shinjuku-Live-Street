<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">교통 시스템 초기 스냅샷과 최신 스냅샷의 성능 비교</title>
  <desc id="desc">차량 10대와 원격 플레이어 80명 밀집 조건의 동일한 300프레임에서 초기 스냅샷과 최신 스냅샷의 평균 CPU 프레임 시간, 느린 프레임 기준, 물리 처리 시간, 프레임당 메모리 할당을 비교한 그래프</desc>

  <defs>
    <linearGradient id="panelBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17191b"/>
      <stop offset="0.55" stop-color="#101418"/>
      <stop offset="1" stop-color="#17120f"/>
    </linearGradient>
    <radialGradient id="stationLight" cx="88%" cy="3%" r="76%">
      <stop offset="0" stop-color="#d69a50" stop-opacity="0.17"/>
      <stop offset="0.42" stop-color="#a46531" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="latestBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cf4138"/>
      <stop offset="0.58" stop-color="#e66b43"/>
      <stop offset="1" stop-color="#efad62"/>
    </linearGradient>
    <linearGradient id="latestChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52261f"/>
      <stop offset="1" stop-color="#30251d"/>
    </linearGradient>
    <pattern id="streetGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#e9c08a" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="cardShadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="barGlow" x="-8%" y="-100%" width="116%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect x="16" y="16" width="1248" height="728" rx="30"/>
    </clipPath>
    <style>
      text { font-family: Inter, Pretendard, "Noto Sans KR", "Segoe UI", sans-serif; }
      .eyebrow { fill: #eaa064; font-size: 14px; font-weight: 700; letter-spacing: 2.4px; }
      .title { fill: #f4eee5; font-size: 36px; font-weight: 750; letter-spacing: 0.2px; }
      .subtitle { fill: #9ba5ad; font-size: 15px; font-weight: 500; letter-spacing: 0.65px; }
      .card-title { fill: #ede8df; font-size: 20px; font-weight: 700; }
      .delta { fill: #f2b16d; font-size: 17px; font-weight: 750; }
      .label { fill: #aab2b7; font-size: 13px; font-weight: 600; letter-spacing: 0.25px; }
      .value { fill: #f5f0e8; font-size: 16px; font-weight: 750; }
      .note { fill: #7f8b92; font-size: 13px; font-weight: 500; letter-spacing: 0.2px; }
      .lane-label { fill: #5ccbc5; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
    </style>
  </defs>

  <!-- 캔버스 외곽은 의도적으로 투명하게 유지합니다. -->
  <g clip-path="url(#panelClip)">
    <rect x="16" y="16" width="1248" height="728" rx="30" fill="url(#panelBackground)"/>
    <rect x="16" y="16" width="1248" height="728" rx="30" fill="url(#stationLight)"/>
    <rect x="16" y="16" width="1248" height="728" rx="30" fill="url(#streetGrid)"/>

    <!-- 신주쿠의 도로와 디버그 라인을 닮은 배경 요소 -->
    <path d="M16 157 C290 151 445 165 664 156 C890 147 1055 149 1264 154" fill="none" stroke="#a83831" stroke-opacity="0.56" stroke-width="2"/>
    <path d="M16 164 C295 158 456 172 675 163 C902 154 1068 156 1264 160" fill="none" stroke="#df9d53" stroke-opacity="0.16" stroke-width="1"/>
    <path d="M16 673 C300 653 483 690 721 668 C943 648 1088 660 1264 651" fill="none" stroke="#54c9c2" stroke-opacity="0.18" stroke-width="1.5"/>
    <path d="M16 694 C292 678 484 706 734 687 C951 670 1110 684 1264 672" fill="none" stroke="#b34236" stroke-opacity="0.22" stroke-width="2"/>
    <g fill="#d08a48" opacity="0.22">
      <path d="M802 151 l10 5 -10 5 3-5z"/><path d="M842 151 l10 5 -10 5 3-5z"/>
      <path d="M882 151 l10 5 -10 5 3-5z"/><path d="M922 151 l10 5 -10 5 3-5z"/>
    </g>
    <text x="1168" y="112" text-anchor="end" fill="#f0c98d" fill-opacity="0.055" font-size="86" font-weight="800">新宿</text>
  </g>

  <rect x="16.5" y="16.5" width="1247" height="727" rx="29.5" fill="none" stroke="#b98a55" stroke-opacity="0.26"/>
  <path d="M46 17 H288" stroke="#c74137" stroke-width="3"/>
  <path d="M288 17 H410" stroke="#dca45f" stroke-width="3"/>

  <!-- Header -->
  <rect x="52" y="47" width="4" height="74" rx="2" fill="#c84036"/>
  <text x="72" y="58" class="eyebrow">UNITY PROFILER · INITIAL / LATEST SNAPSHOT</text>
  <text x="72" y="101" class="title">SHINJUKU TRAFFIC · PERFORMANCE</text>
  <text x="72" y="133" class="subtitle">10 CARS · 80 REMOTE PLAYERS · 300 FRAMES · LOWER IS BETTER</text>
  <text x="1210" y="133" text-anchor="end" class="lane-label">LIVE STREET / SYSTEM LOG</text>

  <!-- Metric cards -->
  <g filter="url(#cardShadow)">
    <rect x="48" y="178" width="580" height="210" rx="18" fill="#14191d" fill-opacity="0.96" stroke="#554739" stroke-opacity="0.62"/>
    <rect x="652" y="178" width="580" height="210" rx="18" fill="#14191d" fill-opacity="0.96" stroke="#554739" stroke-opacity="0.62"/>
    <rect x="48" y="414" width="580" height="210" rx="18" fill="#14191d" fill-opacity="0.96" stroke="#554739" stroke-opacity="0.62"/>
    <rect x="652" y="414" width="580" height="210" rx="18" fill="#14191d" fill-opacity="0.96" stroke="#554739" stroke-opacity="0.62"/>
  </g>

  <!-- 평균 CPU 프레임 시간 -->
  <rect x="76" y="198" width="34" height="3" rx="1.5" fill="#c84036"/>
  <text x="76" y="222" class="card-title">CPU FRAME · AVG</text>
  <rect x="510" y="197" width="90" height="31" rx="15.5" fill="url(#latestChip)" stroke="#a85b3b" stroke-opacity="0.55"/>
  <text x="585" y="218" text-anchor="end" class="delta">−32.5%</text>
  <text x="76" y="266" class="label">INITIAL SNAPSHOT</text>
  <rect x="232" y="254" width="260" height="14" rx="7" fill="#535a61"/>
  <text x="600" y="267" text-anchor="end" class="value">17.65 ms</text>
  <text x="76" y="312" class="label">LATEST SNAPSHOT</text>
  <rect x="232" y="300" width="176" height="14" rx="7" fill="url(#latestBar)" filter="url(#barGlow)"/>
  <text x="600" y="313" text-anchor="end" class="value">11.92 ms</text>
  <text x="76" y="357" class="note">RECIPROCAL · 56.7 → 83.9 FPS EQUIVALENT*</text>

  <!-- 느린 프레임 P95 -->
  <rect x="680" y="198" width="34" height="3" rx="1.5" fill="#c84036"/>
  <text x="680" y="222" class="card-title">SLOW FRAME · P95</text>
  <rect x="1114" y="197" width="90" height="31" rx="15.5" fill="url(#latestChip)" stroke="#a85b3b" stroke-opacity="0.55"/>
  <text x="1189" y="218" text-anchor="end" class="delta">−29.1%</text>
  <text x="680" y="266" class="label">INITIAL SNAPSHOT</text>
  <rect x="836" y="254" width="260" height="14" rx="7" fill="#535a61"/>
  <text x="1204" y="267" text-anchor="end" class="value">24.60 ms</text>
  <text x="680" y="312" class="label">LATEST SNAPSHOT</text>
  <rect x="836" y="300" width="184" height="14" rx="7" fill="url(#latestBar)" filter="url(#barGlow)"/>
  <text x="1204" y="313" text-anchor="end" class="value">17.44 ms</text>
  <text x="680" y="357" class="note">95TH-PERCENTILE CPU FRAME TIME</text>

  <!-- 물리 처리 -->
  <rect x="76" y="434" width="34" height="3" rx="1.5" fill="#58c9c2"/>
  <text x="76" y="458" class="card-title">PHYSICS · AVG</text>
  <rect x="510" y="433" width="90" height="31" rx="15.5" fill="url(#latestChip)" stroke="#a85b3b" stroke-opacity="0.55"/>
  <text x="585" y="454" text-anchor="end" class="delta">−65.3%</text>
  <text x="76" y="502" class="label">INITIAL SNAPSHOT</text>
  <rect x="232" y="490" width="260" height="14" rx="7" fill="#535a61"/>
  <text x="600" y="503" text-anchor="end" class="value">0.49 ms</text>
  <text x="76" y="548" class="label">LATEST SNAPSHOT</text>
  <rect x="232" y="536" width="90" height="14" rx="7" fill="url(#latestBar)" filter="url(#barGlow)"/>
  <text x="600" y="549" text-anchor="end" class="value">0.17 ms</text>
  <text x="76" y="593" class="note">PHYSICS.SIMULATE · AVERAGE</text>

  <!-- GC 할당 -->
  <rect x="680" y="434" width="34" height="3" rx="1.5" fill="#58c9c2"/>
  <text x="680" y="458" class="card-title">GC ALLOC · PER FRAME</text>
  <rect x="1114" y="433" width="90" height="31" rx="15.5" fill="url(#latestChip)" stroke="#a85b3b" stroke-opacity="0.55"/>
  <text x="1189" y="454" text-anchor="end" class="delta">−88.1%</text>
  <text x="680" y="502" class="label">INITIAL SNAPSHOT</text>
  <rect x="836" y="490" width="260" height="14" rx="7" fill="#535a61"/>
  <text x="1204" y="503" text-anchor="end" class="value">101.0 KB</text>
  <text x="680" y="548" class="label">LATEST SNAPSHOT</text>
  <rect x="836" y="536" width="31" height="14" rx="7" fill="url(#latestBar)" filter="url(#barGlow)"/>
  <text x="1204" y="549" text-anchor="end" class="value">12.0 KB</text>
  <text x="680" y="593" class="note">MANAGED ALLOCATION · AVERAGE</text>

  <!-- Footer -->
  <line x1="52" y1="660" x2="1228" y2="660" stroke="#8d704f" stroke-opacity="0.32"/>
  <rect x="52" y="687" width="14" height="14" rx="4" fill="#535a61"/>
  <text x="78" y="699" class="note">INITIAL SNAPSHOT</text>
  <rect x="250" y="687" width="14" height="14" rx="4" fill="url(#latestBar)"/>
  <text x="276" y="699" class="note">LATEST SNAPSHOT</text>
  <text x="1228" y="699" text-anchor="end" class="note">* CPU FRAME-TIME RECIPROCAL, NOT DISPLAYED FPS</text>
</svg>
