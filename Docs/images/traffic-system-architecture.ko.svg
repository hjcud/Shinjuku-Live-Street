      .chip { fill: #f2b16d; font-size: 14px; font-weight: 750; }
      .node-title { fill: #ede8df; font-size: 15px; font-weight: 700; }
      .node-detail { fill: #8f9aa1; font-size: 12px; font-weight: 600; }
