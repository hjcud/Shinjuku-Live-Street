<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">교통 상태의 계산과 전송 구조</title>
  <desc id="desc">에디터에서 만든 차선 데이터를 교통 소유자가 계산하고 압축해 원격 클라이언트에 전달하는 구조</desc>
  <defs>
    <linearGradient id="panelBackground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17191b"/><stop offset="0.55" stop-color="#101418"/><stop offset="1" stop-color="#17120f"/></linearGradient>
    <radialGradient id="stationLight" cx="88%" cy="3%" r="76%"><stop offset="0" stop-color="#d69a50" stop-opacity="0.17"/><stop offset="0.42" stop-color="#a46531" stop-opacity="0.045"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient>
    <linearGradient id="resultBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#17302f"/><stop offset="0.55" stop-color="#1a2928"/><stop offset="1" stop-color="#2d211a"/></linearGradient>
    <pattern id="streetGrid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#e9c08a" stroke-opacity="0.035"/></pattern>
    <filter id="cardShadow" x="-8%" y="-12%" width="116%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000000" flood-opacity="0.24"/></filter>
    <clipPath id="panelClip"><rect x="16" y="16" width="1248" height="488" rx="30"/></clipPath>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Segoe UI", sans-serif; }
      .title { fill: #f4eee5; font-size: 34px; font-weight: 750; }
      .subtitle { fill: #8f9aa1; font-size: 18px; font-weight: 600; }
      .role { fill: #64d0c8; font-size: 16px; font-weight: 750; letter-spacing: 0.6px; }
      .card-title { fill: #ede8df; font-size: 22px; font-weight: 700; }
      .card-body { fill: #97a1a7; font-size: 18px; font-weight: 600; }
      .result-label { fill: #f2b16d; font-size: 16px; font-weight: 750; }
      .result-text { fill: #f4eee5; font-size: 20px; font-weight: 700; }
    </style>
  </defs>
  <g clip-path="url(#panelClip)">
    <rect x="16" y="16" width="1248" height="488" rx="30" fill="url(#panelBackground)"/><rect x="16" y="16" width="1248" height="488" rx="30" fill="url(#stationLight)"/><rect x="16" y="16" width="1248" height="488" rx="30" fill="url(#streetGrid)"/>
    <path d="M16 136 C290 128 445 143 664 134 C890 125 1055 128 1264 133" fill="none" stroke="#a83831" stroke-opacity="0.56" stroke-width="2"/><path d="M16 143 C295 135 456 150 675 141 C902 132 1068 135 1264 139" fill="none" stroke="#df9d53" stroke-opacity="0.16"/>
    <path d="M16 472 C300 452 483 489 721 467 C943 447 1088 459 1264 450" fill="none" stroke="#54c9c2" stroke-opacity="0.18" stroke-width="1.5"/><path d="M16 494 C292 478 484 506 734 487 C951 470 1110 484 1264 472" fill="none" stroke="#b34236" stroke-opacity="0.22" stroke-width="2"/>
  </g>
  <rect x="16.5" y="16.5" width="1247" height="487" rx="29.5" fill="none" stroke="#b98a55" stroke-opacity="0.26"/><path d="M46 17 H288" stroke="#c74137" stroke-width="3"/><path d="M288 17 H410" stroke="#dca45f" stroke-width="3"/>
  <rect x="52" y="43" width="4" height="76" rx="2" fill="#c84036"/><text x="72" y="77" class="title">교통 상태 · 계산과 전송 구조</text><text x="72" y="108" class="subtitle">차량마다 처리하던 계산과 전송을 역할별로 분리</text>

  <g filter="url(#cardShadow)">
    <rect x="48" y="166" width="252" height="220" rx="18" fill="#14191d" fill-opacity="0.97" stroke="#5b4b38" stroke-opacity="0.78"/>
    <rect x="348" y="166" width="252" height="220" rx="18" fill="#14191d" fill-opacity="0.97" stroke="#355553" stroke-opacity="0.78"/>
    <rect x="648" y="166" width="252" height="220" rx="18" fill="#14191d" fill-opacity="0.97" stroke="#5b4b38" stroke-opacity="0.78"/>
    <rect x="948" y="166" width="284" height="220" rx="18" fill="#14191d" fill-opacity="0.97" stroke="#355553" stroke-opacity="0.78"/>
  </g>

  <text x="72" y="201" class="role">EDITOR</text><text x="72" y="237" class="card-title">차선 데이터 생성</text><text x="72" y="274" class="card-body">위치 · 연결 · 정지선</text><text x="72" y="300" class="card-body">실행 전에 미리 계산</text>
  <text x="372" y="201" class="role">TRAFFIC OWNER</text><text x="372" y="237" class="card-title">차량 10대 계산</text><text x="372" y="274" class="card-body">고정 주기 시뮬레이션</text><text x="372" y="300" class="card-body">센서는 2대씩 나눠 검사</text>
  <text x="672" y="201" class="role">NETWORK</text><text x="672" y="237" class="card-title">64비트 차량 상태</text><text x="672" y="274" class="card-body">0.25초마다 상태 전송</text><text x="672" y="300" class="card-body">중복 전송 요청 차단</text>
  <text x="972" y="201" class="role">REMOTE CLIENT</text><text x="972" y="237" class="card-title">차선 데이터로 복원</text><text x="972" y="274" class="card-body">위치·회전 매 프레임 보간</text><text x="972" y="300" class="card-body">끊김 없이 부드럽게 표시</text>

  <g fill="none" stroke="#63cbc4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M307 276 H340"/><path d="M333 269 L340 276 L333 283"/><path d="M607 276 H640"/><path d="M633 269 L640 276 L633 283"/><path d="M907 276 H940"/><path d="M933 269 L940 276 L933 283"/></g>

  <rect x="48" y="414" width="1184" height="52" rx="14" fill="url(#resultBar)" stroke="#5b4b38" stroke-opacity="0.72"/><text x="72" y="446" class="result-label">변경 결과</text><text x="160" y="446" class="result-text">차량마다 계산하고 전송하던 구조를 하나의 교통 관리자가 처리</text>
</svg>
