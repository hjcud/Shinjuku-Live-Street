<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">교통 시스템 초기 구조와 현재 구조 비교</title><desc id="desc">차량별 매 프레임 구조를 중앙 시뮬레이션, 분산 센서, 압축 스냅샷과 원격 보간 구조로 바꾼 내용</desc>
